# Vercel で公開するための設定（ローカル・Docker の起動は requirements.txt を使う。依存関係は同じ内容にそろえる）
[project]
name = "panel-estimate-demo"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "pymupdf==2.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "openai==3.41.0",
    "prisma==0.15.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
