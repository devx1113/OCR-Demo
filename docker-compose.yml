# 盤見積アシスタント：データベース・API・画面をまとめて起動する
#   docker compose up -d --build   → http://localhost:8088
# OpenAI の API キーは .env の OPENAI_API_KEY から API コンテナにだけ渡す（イメージには含めない）
name: panel-estimate

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panel}
      POSTGRES_DB: ${POSTGRES_DB:-panel}
      TZ: Asia/Tokyo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"     # 開発・テスト用（このPCからのみ接続可）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-panel}:${POSTGRES_PASSWORD:-panel}@db:5432/${POSTGRES_DB:-panel}
      WORKERS: ${WORKERS:-1}
    volumes:
      - files:/data/projects                  # 取り込んだ資料・出力した Excel
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  files:
